<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态欢迎横幅 - 周期循环版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #8b0000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #ff0000 0%, #a00000 70%, #600000 100%);
            background-size: 200% 200%;
            animation: pulseBG 10s ease-in-out infinite;
            z-index: -1;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 95vw;
            height: 90vh;
            text-align: center;
        }

        .text-line {
            font-family: "Microsoft YaHei", "SimHei", "STHeiti", sans-serif;
            font-weight: 900;
            white-space: nowrap;
            width: 100%;
            background: linear-gradient(to right, #ffd700 0%, #fff8dc 25%, #ffd700 50%, #fff8dc 75%, #ffd700 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            
            /* 金色流光动画：一直存在 */
            animation: shine 4s linear infinite;
            
            transform-origin: center;
            display: inline-block;
            opacity: 0; /* 初始透明 */
        }

        /* 核心逻辑：定义一个 10 秒的呼吸动画 */
        /* 0-15% 淡入, 85-100% 淡出 */
        .breathe-animation {
            animation: shine 4s linear infinite, breatheEffect 10s ease-in-out infinite;
        }

        @keyframes breatheEffect {
            0%   { opacity: 0; transform: scale(0.9); }
            10%  { opacity: 1; transform: scale(1); }
            90%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes pulseBG {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="content-wrapper" id="wrapper">
        <div id="line1" class="text-line"></div>
        <div id="line2" class="text-line"></div>
    </div>

    <script>
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const defaultContent = "热烈欢迎阿比老师莅临指导|预祝我队演出取得圆满成功";
            const rawText = urlParams.get('text') || defaultContent;
            const parts = rawText.split('|');
            
            const l1 = document.getElementById('line1');
            const l2 = document.getElementById('line2');

            l1.innerText = parts[0];
            if (parts.length > 1) {
                l2.innerText = parts[1];
            } else {
                l2.style.display = 'none';
            }

            // 自适应缩放逻辑
            function rescale() {
                const lines = [l1];
                if (parts.length > 1) lines.push(l2);
                lines.forEach(line => {
                    line.style.fontSize = "15vw"; 
                    const containerWidth = document.getElementById('wrapper').offsetWidth;
                    const textWidth = line.scrollWidth;
                    if (textWidth > containerWidth) {
                        const ratio = (containerWidth / textWidth) * 0.95;
                        line.style.fontSize = (15 * ratio) + "vw";
                    }
                });
            }

            rescale();
            window.addEventListener('resize', rescale);

            // 触发动画循环
            // 我们先移除类再添加，或者直接利用 CSS infinite
            l1.classList.add('breathe-animation');
            if (parts.length > 1) {
                // 第二行延迟一点点，增加灵动感
                setTimeout(() => {
                    l2.classList.add('breathe-animation');
                }, 300);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
