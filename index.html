<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎横幅</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #8b0000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #ff0000 0%, #a00000 70%, #600000 100%);
            background-size: 200% 200%;
            animation: pulseBG 10s ease-in-out infinite;
            z-index: -1;
        }

        /* 自动布局容器 */
        #wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* 均匀分布每一行 */
            align-items: center;
            width: 95vw;
            height: 90vh;
            text-align: center;
        }

        .text-line {
            font-family: "Microsoft YaHei", "SimHei", "STHeiti", sans-serif;
            font-weight: 900;
            white-space: nowrap;
            width: 100%;
            background: linear-gradient(to right, #ffd700 0%, #fff8dc 25%, #ffd700 50%, #fff8dc 75%, #ffd700 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.5));
            
            /* 10秒周期呼吸动画 */
            animation: shine 4s linear infinite, breatheEffect 10s ease-in-out infinite;
            opacity: 0;
            transform-origin: center;
        }

        @keyframes breatheEffect {
            0% { opacity: 0; transform: scale(0.9); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes pulseBG {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>
    <div id="wrapper"></div>

    <script>
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            // 默认文案，你可以随意增加行数，用 | 隔开
            const defaultContent = "热烈欢迎姬楠楠老师莅临指导|预祝我队演出取得圆满成功";
            const rawText = urlParams.get('text') || defaultContent;
            const lines = rawText.split('|');
            
            const wrapper = document.getElementById('wrapper');
            wrapper.innerHTML = ''; // 清空内容

            // 1. 根据行数计算初始最大高度（vw）
            // 如果只有1行，字可以很大；如果5行，字自然要小
            const baseFontSize = Math.min(15, 80 / lines.length);

            lines.forEach((content, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'text-line';
                lineDiv.innerText = content;
                // 给每一行增加一点点动画延迟，形成交替浮现感
                lineDiv.style.animationDelay = `${index * 0.2}s, ${0}s`; 
                wrapper.appendChild(lineDiv);
            });

            // 2. 自适应缩放函数
            function rescale() {
                const domLines = document.querySelectorAll('.text-line');
                domLines.forEach(line => {
                    line.style.fontSize = baseFontSize + "vw"; 
                    const containerWidth = wrapper.offsetWidth;
                    const textWidth = line.scrollWidth;
                    
                    // 如果单行太长，继续缩小
                    if (textWidth > containerWidth) {
                        const ratio = (containerWidth / textWidth) * 0.95;
                        line.style.fontSize = (baseFontSize * ratio) + "vw";
                    }
                });
            }

            // 初始执行
            rescale();
            window.addEventListener('resize', rescale);
        }

        window.onload = init;
    </script>
</body>
</html>
